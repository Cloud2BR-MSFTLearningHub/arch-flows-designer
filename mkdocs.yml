site_name: Arch Flows Designer
site_description: Draw Azure cloud architecture diagrams, service flows, and infrastructure topologies in the browser.
site_url: https://cloud2br-msftlearninghub.github.io/arch-flows-designer/
repo_url: https://github.com/Cloud2BR-MSFTLearningHub/arch-flows-designer
repo_name: Cloud2BR-MSFTLearningHub/arch-flows-designer
docs_dir: docs
site_dir: site
copyright: Copyright &copy; 2026 <a href="https://github.com/Cloud2BR-MSFTLearningHub" target="_blank" rel="noopener">Cloud2BR OSS - Learning Hub</a>
theme:
  name: material
  logo: https://avatars.githubusercontent.com/u/195347873?v=4
  favicon: https://avatars.githubusercontent.com/u/195347873?v=4
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: blue
    accent: blue
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
extra_css:
  - assets/css/custom.css
extra_javascript:
  - assets/js/logo-link.js
  - assets/js/external-links.js
  - assets/js/icons.js
  - assets/js/designer.js
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cloud2BR-MSFTLearningHub
      name: Cloud2BR OSS - Learning Hub
nav:
  - Designer: index.md
  - About: overview.md
